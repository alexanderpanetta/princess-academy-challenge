<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Princess Academy Challenge</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;700&display=swap');

        body {
            font-family: 'Nunito', 'Georgia', serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
        }

        .game-container {
            width: 900px;
            height: 650px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            overflow: hidden;
            position: relative;
        }

        .screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            text-align: center;
            position: absolute;
            top: 0;
            left: 0;
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
        }

        .screen.active {
            display: flex;
        }

        /* Title Screen */
        #title-screen {
            background-image: url('images/title-screen.png');
            justify-content: flex-end;
            padding-bottom: 60px;
        }

        .title-content {
            background: rgba(255,255,255,0.95);
            padding: 25px 40px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        #title-screen h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 36px;
            color: #C71585;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            margin-bottom: 10px;
        }

        #title-screen .subtitle {
            font-size: 18px;
            color: #8B4513;
            margin-bottom: 20px;
        }

        .princess-avatar {
            width: 100px;
            height: 120px;
            margin: 0 auto 15px;
        }

        .princess-avatar img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .btn {
            padding: 12px 35px;
            font-size: 20px;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        .btn-primary {
            background: linear-gradient(180deg, #FF69B4 0%, #C71585 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(199,21,133,0.4);
            border: 3px solid #FFB6C1;
        }

        .btn-answer {
            width: 100%;
            padding: 14px 20px;
            font-size: 18px;
            margin: 6px 0;
            background: linear-gradient(180deg, #FFF0F5 0%, #FFB6C1 100%);
            color: #8B008B;
            border: 3px solid #DDA0DD;
            border-radius: 15px;
        }

        .btn-answer:hover {
            background: linear-gradient(180deg, #FFB6C1 0%, #FF69B4 100%);
            color: white;
            border-color: #C71585;
        }

        .btn-answer.correct {
            background: linear-gradient(180deg, #90EE90 0%, #32CD32 100%);
            color: white;
            border-color: #228B22;
        }

        .btn-answer.incorrect {
            background: linear-gradient(180deg, #FFB6C1 0%, #FF6B6B 100%);
            color: white;
            border-color: #DC143C;
        }

        /* Question Screen */
        .question-screen-reading {
            background-image: url('images/library.png');
        }

        .question-screen-math {
            background-image: url('images/treasury.png');
        }

        .question-panel {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 25px 35px;
            width: 90%;
            max-width: 700px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.2);
            border: 4px solid #DDA0DD;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: #f0e6fa;
            border-radius: 10px;
            margin-bottom: 15px;
            overflow: hidden;
            border: 2px solid #DDA0DD;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #FF69B4, #C71585);
            transition: width 0.3s;
            border-radius: 10px;
        }

        .challenge-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 10px;
        }

        .helper-icon {
            width: 60px;
            height: 60px;
        }

        .helper-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .challenge-title {
            font-family: 'Fredoka One', cursive;
            font-size: 24px;
            color: #C71585;
        }

        .question-counter {
            font-size: 16px;
            color: #8B4513;
            margin-bottom: 15px;
        }

        .question-text {
            font-size: 20px;
            color: #4B0082;
            margin-bottom: 20px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.4;
        }

        .answers-container {
            width: 100%;
        }

        /* Transition Screen */
        #transition-screen {
            background-image: url('images/library.png');
        }

        .transition-panel {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 35px 50px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.2);
            border: 4px solid #DDA0DD;
        }

        #transition-screen h2 {
            font-family: 'Fredoka One', cursive;
            font-size: 32px;
            color: #C71585;
            margin-bottom: 15px;
        }

        #transition-screen p {
            font-size: 20px;
            color: #8B4513;
            margin-bottom: 10px;
        }

        .score-display {
            font-family: 'Fredoka One', cursive;
            font-size: 36px;
            color: #4B0082;
            margin: 15px 0;
        }

        .next-challenge-text {
            font-size: 18px;
            color: #6B4423;
            margin: 20px 0;
        }

        /* Results Screen */
        #results-screen {
            background-image: url('images/victory.png');
        }

        .results-panel {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 30px 50px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.2);
            border: 4px solid #FFD700;
        }

        #results-screen h2 {
            font-family: 'Fredoka One', cursive;
            font-size: 36px;
            color: #C71585;
            margin-bottom: 15px;
        }

        .final-score {
            font-size: 22px;
            color: #4B0082;
            margin-bottom: 15px;
        }

        .score-breakdown {
            font-size: 16px;
            color: #8B4513;
            margin-bottom: 20px;
        }

        .medal-container {
            width: 120px;
            height: 140px;
            margin: 15px auto;
        }

        .medal-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.3));
        }

        .medal-text {
            font-family: 'Fredoka One', cursive;
            font-size: 26px;
            color: #8B4513;
            margin-bottom: 20px;
        }

        .celebration {
            font-size: 40px;
            margin-bottom: 10px;
        }

        /* Feedback Overlay */
        .feedback-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.2s ease-in;
        }

        .feedback-overlay.active {
            display: flex;
        }

        .feedback-overlay.correct-overlay {
            background: rgba(50, 205, 50, 0.85);
        }

        .feedback-overlay.incorrect-overlay {
            background: rgba(220, 20, 60, 0.75);
        }

        .feedback-card {
            text-align: center;
            animation: popIn 0.3s ease-out;
        }

        .feedback-card img {
            max-width: 350px;
            max-height: 320px;
            border-radius: 16px;
            border: 5px solid white;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            object-fit: contain;
            background: #fff;
        }

        .feedback-label {
            font-family: 'Fredoka One', cursive;
            font-size: 32px;
            color: white;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.4);
            margin-bottom: 12px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes popIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* Medal-specific colors */
        .gold .results-panel { border-color: #FFD700; }
        .gold .medal-text { color: #DAA520; }

        .silver .results-panel { border-color: #C0C0C0; }
        .silver .medal-text { color: #808080; }

        .bronze .results-panel { border-color: #CD7F32; }
        .bronze .medal-text { color: #8B4513; }

        .no-medal .results-panel { border-color: #DDA0DD; }
        .no-medal .medal-text { color: #C71585; }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- Title Screen -->
        <div id="title-screen" class="screen active">
            <div class="title-content">
                <div class="princess-avatar">
                    <img src="images/princess.png" alt="Princess">
                </div>
                <h1>Princess Academy Challenge</h1>
                <p class="subtitle">Become a Certified Royal Scholar!</p>
                <button class="btn btn-primary" onclick="startGame()">Start Challenge</button>
            </div>
        </div>

        <!-- Question Screen -->
        <div id="question-screen" class="screen question-screen-reading">
            <div class="question-panel">
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <div class="challenge-header">
                    <div class="helper-icon" id="helper-icon">
                        <img src="images/owl.png" alt="Helper">
                    </div>
                    <h2 class="challenge-title" id="challenge-title">The Royal Library</h2>
                </div>
                <p class="question-counter" id="question-counter">Question 1 of 5</p>
                <div class="question-text" id="question-text">
                    What is the question?
                </div>
                <div class="answers-container" id="answers-container">
                    <!-- Answers will be inserted here -->
                </div>
            </div>
        </div>

        <!-- Transition Screen -->
        <div id="transition-screen" class="screen">
            <div class="transition-panel">
                <h2>Reading Complete!</h2>
                <p>You scored:</p>
                <div class="score-display" id="reading-score-display">0 out of 5</div>
                <p class="next-challenge-text">Now let's head to the Royal Treasury!</p>
                <div class="helper-icon" style="margin: 20px auto;">
                    <img src="images/dwarf.png" alt="Dwarf">
                </div>
                <button class="btn btn-primary" onclick="startMathChallenge()">Start Math Challenge</button>
            </div>
        </div>

        <!-- Feedback Overlay -->
        <div id="feedback-overlay" class="feedback-overlay">
            <div class="feedback-card">
                <p class="feedback-label" id="feedback-label"></p>
                <img id="feedback-image" src="" alt="Feedback">
            </div>
        </div>

        <!-- Results Screen -->
        <div id="results-screen" class="screen">
            <div class="results-panel">
                <div class="celebration" id="celebration"></div>
                <h2>Challenge Complete!</h2>
                <div class="final-score" id="final-score">You scored 8 out of 10!</div>
                <div class="score-breakdown" id="score-breakdown">Reading: 4/5 | Math: 4/5</div>
                <div class="medal-container" id="medal-container">
                    <img src="images/gold-medal.png" alt="Medal" id="medal-image">
                </div>
                <p class="medal-text" id="medal-text">Gold Medal!</p>
                <button class="btn btn-primary" onclick="restartGame()">Play Again</button>
            </div>
        </div>
    </div>

    <script>
        // Audio Context for music
        let audioContext = null;

        function getAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            return audioContext;
        }

        function playNote(frequency, startTime, duration, type = 'sine', volume = 0.3) {
            const ctx = getAudioContext();
            const oscillator = ctx.createOscillator();
            const gainNode = ctx.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(ctx.destination);

            oscillator.frequency.value = frequency;
            oscillator.type = type;

            gainNode.gain.setValueAtTime(volume, startTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + duration - 0.05);

            oscillator.start(startTime);
            oscillator.stop(startTime + duration);
        }

        function playVictoryMusic() {
            // Happy triumphant fanfare for Gold/Silver
            const ctx = getAudioContext();
            const now = ctx.currentTime;

            // C major triumphant melody
            const notes = [
                { freq: 523.25, time: 0, dur: 0.2 },     // C5
                { freq: 659.25, time: 0.2, dur: 0.2 },   // E5
                { freq: 783.99, time: 0.4, dur: 0.2 },   // G5
                { freq: 1046.50, time: 0.6, dur: 0.4 },  // C6
                { freq: 783.99, time: 1.0, dur: 0.2 },   // G5
                { freq: 1046.50, time: 1.2, dur: 0.6 },  // C6 (held)
            ];

            notes.forEach(note => {
                playNote(note.freq, now + note.time, note.dur, 'triangle', 0.4);
            });

            // Add harmony
            const harmony = [
                { freq: 261.63, time: 0, dur: 0.8 },     // C4
                { freq: 329.63, time: 0, dur: 0.8 },     // E4
                { freq: 392.00, time: 0.8, dur: 1.0 },   // G4
                { freq: 523.25, time: 0.8, dur: 1.0 },   // C5
            ];

            harmony.forEach(note => {
                playNote(note.freq, now + note.time, note.dur, 'sine', 0.2);
            });
        }

        function playOkayMusic() {
            // Moderate, encouraging tune for Bronze
            const ctx = getAudioContext();
            const now = ctx.currentTime;

            const notes = [
                { freq: 392.00, time: 0, dur: 0.3 },     // G4
                { freq: 440.00, time: 0.3, dur: 0.3 },   // A4
                { freq: 493.88, time: 0.6, dur: 0.3 },   // B4
                { freq: 523.25, time: 0.9, dur: 0.5 },   // C5
            ];

            notes.forEach(note => {
                playNote(note.freq, now + note.time, note.dur, 'triangle', 0.3);
            });
        }

        function playSadMusic() {
            // Gentle, encouraging "try again" melody
            const ctx = getAudioContext();
            const now = ctx.currentTime;

            // Descending minor melody
            const notes = [
                { freq: 392.00, time: 0, dur: 0.4 },     // G4
                { freq: 349.23, time: 0.4, dur: 0.4 },   // F4
                { freq: 329.63, time: 0.8, dur: 0.4 },   // E4
                { freq: 293.66, time: 1.2, dur: 0.6 },   // D4
            ];

            notes.forEach(note => {
                playNote(note.freq, now + note.time, note.dur, 'sine', 0.25);
            });
        }

        // Good and Evil image pools
        const goodImages = [
            'images/good/hq720.jpg',
            'images/good/good_1.png',
            'images/good/good_2.png',
            'images/good/good_3.png',
            'images/good/good_4.png',
            'images/good/good_5.png',
            'images/good/good_6.png',
        ];

        const evilImages = [
            'images/evil/cinderella.jpg',
            'images/evil/jafar.jpg',
            'images/evil/evil_1.png',
            'images/evil/evil_2.png',
            'images/evil/evil_3.png',
            'images/evil/evil_4.png',
            'images/evil/evil_5.png',
        ];

        function getRandomImage(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function showFeedbackOverlay(isCorrect) {
            const overlay = document.getElementById('feedback-overlay');
            const label = document.getElementById('feedback-label');
            const img = document.getElementById('feedback-image');

            overlay.classList.remove('correct-overlay', 'incorrect-overlay');

            if (isCorrect) {
                overlay.classList.add('correct-overlay');
                label.textContent = 'Correct!';
                img.src = getRandomImage(goodImages);
            } else {
                overlay.classList.add('incorrect-overlay');
                label.textContent = 'Not quite!';
                img.src = getRandomImage(evilImages);
            }

            overlay.classList.add('active');
        }

        function hideFeedbackOverlay() {
            document.getElementById('feedback-overlay').classList.remove('active');
        }

        // Game State
        let currentQuestion = 0;
        let currentChallenge = 'reading';
        let readingScore = 0;
        let mathScore = 0;
        let answeredCurrent = false;
        let selectedReadingQuestions = [];
        let selectedMathQuestions = [];

        // Reading Question Pool - 25 questions (5 per slot) - MODERATELY CHALLENGING
        const readingQuestionPool = [
            // Slot 1: Inference with richer vocabulary
            [
                {
                    question: "Read: 'Tom beamed with delight when he saw the birthday cake.' How did Tom feel?",
                    answers: ["Sad", "Happy", "Scared", "Angry"],
                    correct: 1
                },
                {
                    question: "Read: 'The puppy wagged its tail with enthusiasm when Sara came home.' What does 'enthusiasm' mean here?",
                    answers: ["Anger", "Fear", "Great excitement", "Sleepiness"],
                    correct: 2
                },
                {
                    question: "Read: 'Mom bundled up in her coat and boots. A blizzard was howling outside.' What is a 'blizzard'?",
                    answers: ["A sunny day", "A big snowstorm", "A gentle rain", "A light breeze"],
                    correct: 1
                },
                {
                    question: "Read: 'Lily rubbed her eyes and yawned. She was completely exhausted.' What does 'exhausted' mean?",
                    answers: ["Hungry", "Very tired", "Happy", "Cold"],
                    correct: 1
                },
                {
                    question: "Read: 'Jake grimaced when he dropped his ice cream on the pavement.' What does 'grimaced' mean?",
                    answers: ["Smiled", "Laughed", "Made an unhappy face", "Fell asleep"],
                    correct: 2
                }
            ],
            // Slot 2: Vocabulary with harder words
            [
                {
                    question: "Read: 'The miniature ant was almost invisible.' What does 'miniature' mean?",
                    answers: ["Big", "Very small", "Fast", "Loud"],
                    correct: 1
                },
                {
                    question: "Read: 'The cheerful girl was grinning all day.' What is the opposite of 'cheerful'?",
                    answers: ["Glad", "Joyful", "Gloomy", "Delighted"],
                    correct: 2
                },
                {
                    question: "Read: 'The tremendous thunder startled the cat.' What does 'tremendous' mean?",
                    answers: ["Tiny", "Very big or powerful", "Soft", "Slow"],
                    correct: 1
                },
                {
                    question: "Read: 'The swift rabbit darted across the meadow.' What does 'swift' mean?",
                    answers: ["Slow", "Quick", "Tired", "Big"],
                    correct: 1
                },
                {
                    question: "Read: 'The courageous knight ventured into the dark cave.' What does 'courageous' mean?",
                    answers: ["Scared", "Brave", "Tired", "Sad"],
                    correct: 1
                }
            ],
            // Slot 3: Cause and effect with richer language
            [
                {
                    question: "Read: 'It was pouring, so we had to remain indoors.' What does 'remain' mean here?",
                    answers: ["Run outside", "Stay", "Leave", "Sleep"],
                    correct: 1
                },
                {
                    question: "Read: 'Sam was famished, so he devoured a sandwich.' What does 'famished' mean?",
                    answers: ["Bored", "Very hungry", "Tired", "Cold"],
                    correct: 1
                },
                {
                    question: "Read: 'The plant flourished because it received plenty of water and sunshine.' What does 'flourished' mean?",
                    answers: ["Grew well", "Died", "Stayed the same", "Fell over"],
                    correct: 0
                },
                {
                    question: "Read: 'Emma dozed off because she was weary from the journey.' What does 'weary' mean?",
                    answers: ["Hungry", "Happy", "Tired", "Bored"],
                    correct: 2
                },
                {
                    question: "Read: 'The snowman gradually melted when the temperature rose.' What does 'gradually' mean?",
                    answers: ["All at once", "Slowly, bit by bit", "Never", "Loudly"],
                    correct: 1
                }
            ],
            // Slot 4: Main idea with richer language
            [
                {
                    question: "Read: 'Felines enjoy napping. They also love to pounce and play. They make wonderful companions.' What are 'felines'?",
                    answers: ["Dogs", "Birds", "Cats", "Fish"],
                    correct: 2
                },
                {
                    question: "Read: 'Proper dental hygiene is important. I brush every morning and night.' What does 'hygiene' mean here?",
                    answers: ["Eating food", "Keeping clean and healthy", "Going to bed", "Playing outside"],
                    correct: 1
                },
                {
                    question: "Read: 'We visited the shore. We built sculptures in the sand and waded in the surf.' What does 'shore' mean?",
                    answers: ["The park", "The zoo", "The edge of the ocean", "The store"],
                    correct: 2
                },
                {
                    question: "Read: 'Birds migrate south for the winter. They have plumage and build nests.' What does 'plumage' mean?",
                    answers: ["Fins", "Fur", "Claws", "Feathers"],
                    correct: 3
                },
                {
                    question: "Read: 'In autumn, foliage changes color — crimson, amber, and gold — then drifts to the ground.' What is 'foliage'?",
                    answers: ["Flowers", "Rocks", "Snow", "Leaves"],
                    correct: 3
                }
            ],
            // Slot 5: Story comprehension with richer language
            [
                {
                    question: "Read: 'Ben has a loyal companion named Max. Max has a chestnut coat. They adore playing fetch.' What color is 'chestnut'?",
                    answers: ["White", "Black", "Reddish-brown", "Gray"],
                    correct: 2
                },
                {
                    question: "Read: 'Lily visited the market to purchase apples and milk, then she headed home.' What does 'purchase' mean?",
                    answers: ["Throw away", "Buy", "Cook", "Hide"],
                    correct: 1
                },
                {
                    question: "Read: 'It was Anna's birthday celebration. She had a magnificent pink cake and received numerous presents.' What does 'numerous' mean?",
                    answers: ["Zero", "One", "A lot of", "Tiny"],
                    correct: 2
                },
                {
                    question: "Read: 'Tom observed the animals at the zoo. The primates were his absolute favorite.' What are 'primates'?",
                    answers: ["Lions", "Fish", "Monkeys and apes", "Tigers"],
                    correct: 2
                },
                {
                    question: "Read: 'Mom prepared a scrumptious batch of pancakes for breakfast with butter and syrup.' What does 'scrumptious' mean?",
                    answers: ["Ugly", "Scary", "Delicious", "Cold"],
                    correct: 2
                }
            ]
        ];

        // Math Question Pool - 25 questions (5 per slot) - EASIER
        const mathQuestionPool = [
            // Slot 1: Simple addition (sums up to 10)
            [
                {
                    question: "What is 3 + 4?",
                    answers: ["6", "7", "8", "9"],
                    correct: 1
                },
                {
                    question: "What is 5 + 2?",
                    answers: ["6", "7", "8", "9"],
                    correct: 1
                },
                {
                    question: "What is 4 + 5?",
                    answers: ["7", "8", "9", "10"],
                    correct: 2
                },
                {
                    question: "What is 6 + 3?",
                    answers: ["7", "8", "9", "10"],
                    correct: 2
                },
                {
                    question: "What is 2 + 6?",
                    answers: ["6", "7", "8", "9"],
                    correct: 2
                }
            ],
            // Slot 2: Simple subtraction (within 10)
            [
                {

            [

        function selectRandomQuestions() {
            // Select one random question from each slot
            selectedReadingQuestions = readingQuestionPool.map(slot =>
                slot[Math.floor(Math.random() * slot.length)]
            );
            selectedMathQuestions = mathQuestionPool.map(slot =>
                slot[Math.floor(Math.random() * slot.length)]
            );
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById(screenId).classList.add('active');
        }

        function startGame() {
            currentQuestion = 0;
            currentChallenge = 'reading';
            readingScore = 0;
            mathScore = 0;

            // Select new random questions for this game
            selectRandomQuestions();

            const questionScreen = document.getElementById('question-screen');
            questionScreen.classList.remove('question-screen-math');
            questionScreen.classList.add('question-screen-reading');

            showScreen('question-screen');
            loadQuestion();
        }

        function startMathChallenge() {
            currentQuestion = 0;
            currentChallenge = 'math';

            const questionScreen = document.getElementById('question-screen');
            questionScreen.classList.remove('question-screen-reading');
            questionScreen.classList.add('question-screen-math');

            document.getElementById('helper-icon').innerHTML = '<img src="images/dwarf.png" alt="Dwarf">';

            showScreen('question-screen');
            loadQuestion();
        }

        function loadQuestion() {
            answeredCurrent = false;
            const questions = currentChallenge === 'reading' ? selectedReadingQuestions : selectedMathQuestions;
            const question = questions[currentQuestion];

            // Update UI
            document.getElementById('challenge-title').textContent =
                currentChallenge === 'reading' ? 'The Royal Library' : 'The Royal Treasury';

            document.getElementById('question-counter').textContent =
                `Question ${currentQuestion + 1} of 5`;

            // Update progress bar (0-10 total questions)
            const totalProgress = currentChallenge === 'reading' ? currentQuestion : currentQuestion + 5;
            document.getElementById('progress-fill').style.width = `${totalProgress * 10}%`;

            document.getElementById('question-text').textContent = question.question;

            // Update helper icon
            document.getElementById('helper-icon').innerHTML =
                `<img src="images/${currentChallenge === 'reading' ? 'owl' : 'dwarf'}.png" alt="Helper">`;

            // Create answer buttons
            const container = document.getElementById('answers-container');
            container.innerHTML = '';

            question.answers.forEach((answer, index) => {
                const btn = document.createElement('button');
                btn.className = 'btn btn-answer';
                btn.textContent = answer;
                btn.onclick = () => selectAnswer(index);
                container.appendChild(btn);
            });
        }

        function selectAnswer(index) {
            if (answeredCurrent) return;
            answeredCurrent = true;

            const questions = currentChallenge === 'reading' ? selectedReadingQuestions : selectedMathQuestions;
            const question = questions[currentQuestion];
            const buttons = document.querySelectorAll('.btn-answer');

            // Show correct/incorrect
            buttons.forEach((btn, i) => {
                btn.style.pointerEvents = 'none';
                if (i === question.correct) {
                    btn.classList.add('correct');
                } else if (i === index && index !== question.correct) {
                    btn.classList.add('incorrect');
                }
            });

            // Update score
            const isCorrect = index === question.correct;
            if (isCorrect) {
                if (currentChallenge === 'reading') {
                    readingScore++;
                } else {
                    mathScore++;
                }
            }

            // Show feedback overlay with good/evil image
            setTimeout(() => {
                showFeedbackOverlay(isCorrect);
            }, 800);

            // Hide overlay and move to next question
            setTimeout(() => {
                hideFeedbackOverlay();
                currentQuestion++;

                if (currentQuestion >= 5) {
                    if (currentChallenge === 'reading') {
                        // Show transition screen
                        document.getElementById('reading-score-display').textContent =
                            `${readingScore} out of 5`;
                        showScreen('transition-screen');
                    } else {
                        // Show final results
                        showResults();
                    }
                } else {
                    loadQuestion();
                }
            }, 2800);
        }

        function showResults() {
            const totalScore = readingScore + mathScore;
            let medalType, medalText, celebration, medalImage;

            if (totalScore >= 8) {
                medalType = 'gold';
                medalText = 'Gold Medal!';
                celebration = '🏆 ✨ 🎉';
                medalImage = 'images/gold-medal.png';
                setTimeout(playVictoryMusic, 300);
            } else if (totalScore >= 5) {
                medalType = 'silver';
                medalText = 'Silver Medal!';
                celebration = '🥈 🎉';
                medalImage = 'images/silver-medal.png';
                setTimeout(playVictoryMusic, 300);
            } else if (totalScore >= 3) {
                medalType = 'bronze';
                medalText = 'Bronze Medal!';
                celebration = '🥉 👏';
                medalImage = 'images/bronze-medal.png';
                setTimeout(playOkayMusic, 300);
            } else {
                medalType = 'no-medal';
                medalText = 'Keep Practicing!';
                celebration = '⭐ 💪';
                medalImage = 'images/star-ribbon.png';
                setTimeout(playSadMusic, 300);
            }

            const resultsScreen = document.getElementById('results-screen');
            resultsScreen.className = `screen ${medalType}`;

            document.getElementById('celebration').textContent = celebration;
            document.getElementById('final-score').textContent = `You scored ${totalScore} out of 10!`;
            document.getElementById('score-breakdown').textContent = `Reading: ${readingScore}/5 | Math: ${mathScore}/5`;
            document.getElementById('medal-text').textContent = medalText;
            document.getElementById('medal-image').src = medalImage;

            showScreen('results-screen');
        }

        function restartGame() {
            const questionScreen = document.getElementById('question-screen');
            questionScreen.classList.remove('question-screen-math');
            questionScreen.classList.add('question-screen-reading');
            document.getElementById('helper-icon').innerHTML = '<img src="images/owl.png" alt="Owl">';
            showScreen('title-screen');
        }
    </script>
